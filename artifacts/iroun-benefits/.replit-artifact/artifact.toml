kind = "mobile"
previewPath = "/"
title = "이로운혜택"
description = "이로운사람들의 사업자·개인·가구 지원정보 네이티브 앱. 무료 일반 열람과 서버 검증 맞춤 이용권을 분리합니다."
version = "1.0.0"
id = "artifacts/iroun-benefits"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24886

[services.development]
run = "pnpm --filter @workspace/iroun-benefits run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/iroun-benefits", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/iroun-benefits", "run", "serve" ]

[services.env]
PORT = "24886"
BASE_PATH = "/"

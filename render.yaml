# Render 한 번에 만들기(Blueprint): 데이터베이스 + 앱 서버, 싱가포르. 크기는 Render 기본값(가장 작은 유료).
# 키 값은 여기 넣지 않는다. 처음 만들 때 Render 화면이 물어보면 그 칸에 넣는다(비워 두고 나중에 넣어도 됨).
databases:
  - name: iroun-db
    region: singapore

services:
  - type: web
    name: iroun-api
    runtime: docker
    region: singapore
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iroun-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CRM_APP_INBOUND_SECRET
        sync: false
      # 공고 자동 수집 켜기(비밀값 아님). 실제 키 4개는 Render 설정 화면에 직접 넣는다.
      - key: IROUN_OFFICIAL_FEEDS_ENABLED
        value: "true"
      - key: IROUN_FEED_INTERVAL_MINUTES
        value: "60"
      - key: BIZINFO_API_APPROVED
        value: "true"
      - key: BIZINFO_TERMS_APPROVED
        value: "true"
      - key: IROUN_BIZINFO_APPROVED_SCOPE
        value: "기업마당 지원사업 공고 목록 수집"
      - key: IROUN_GOV24_APPROVED
        value: "true"
      - key: IROUN_WELFARECENTRAL_APPROVED
        value: "true"
      - key: IROUN_WELFARELOCAL_APPROVED
        value: "true"
      # 기업마당 공고 중 내용이 확실한 것(확신도 80 이상·주의사항 없음)은 바로 공개, 나머지는 검토 대기.
      - key: IROUN_AUTO_PUBLISH_CONFIDENT
        value: "true"
      - key: IROUN_BIZINFO_MAX_PAGES
        value: "3"
